<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Khmer Font Test</title>
    <style>
      body {
        /* Added quotes around the font name */
        font-family: "Noto Sans Khmer", sans-serif !important;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      a {
        text-decoration: none;
      }
      button {
        border: none;
        outline: none;
        background-color: red;
        color: white;
        padding: 20px 25px;
        border-radius: 10px;
        font-size: 24px;
        cursor: pointer;
        /* Ensure font-family is inherited or explicitly set on buttons */
        font-family: "Noto Sans Khmer", sans-serif;
      }
      button:active {
        background-color: darkred;
      }
    </style>
  </head>
  <body>
    <a href="https://youtu.be/4oxnF6Oqk-4?si=wFUG7vLOFLCqp5Um">
      <button>វិធីធ្វើឱ្យCrushលួចស្រលាញ់</button>
    </a>
  </body>
</html>
